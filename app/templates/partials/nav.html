<nav class="nav">
  <a class="brand" href="{{ url_for('main.home') }}"><i class="bi bi-recycle"></i>LocWaste</a>
  <div class="nav-menu" id="nav-menu">
    <div class="links">
      {{ nav_links }}
    </div>
    <div class="account">
      <button class="icon-btn" id="theme-toggle" type="button" title="Toggle theme" aria-label="Toggle theme"><i class="bi bi-moon"></i></button>
      {% if current_user.is_authenticated %}
        <span class="user-name">{{ current_user.name }}</span>
        <form method="post" action="{{ url_for('auth.logout') }}">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <button class="btn btn-ghost" type="submit">Sign out</button>
        </form>
      {% else %}
        <a class="btn btn-ghost" href="{{ url_for('auth.login') }}">Sign in</a>
      {% endif %}
    </div>
  </div>
  <a class="btn btn-brand report-btn" href="{{ url_for('reports.new') }}" aria-label="Report waste"><i class="bi bi-geo-alt-fill"></i><span class="btn-text">Report waste</span></a>
  <button class="icon-btn menu-btn" id="menu-toggle" type="button" aria-label="Menu" aria-controls="nav-menu" aria-expanded="false"><i class="bi bi-list"></i></button>
</nav>
