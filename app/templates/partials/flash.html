{% with messages = get_flashed_messages(with_categories=true) %}
  {% if messages %}
    <div class="wrap flashes">
      {% for category, message in messages %}
        <div class="flash {{ category }}" role="status">
          <i class="bi {{ 'bi-check-circle' if category == 'success' else 'bi-exclamation-circle' }}"></i>{{ message }}
        </div>
      {% endfor %}
    </div>
  {% endif %}
{% endwith %}
